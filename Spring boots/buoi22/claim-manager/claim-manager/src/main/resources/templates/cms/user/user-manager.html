<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" class="light-style layout-menu-fixed" dir="ltr"
      data-theme="theme-default" data-assets-path="../assets/" data-template="vertical-menu-template-free">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
    <title>Quản lý yêu cầu - BIDV MetLife</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="../assets/vendor/fonts/boxicons.css"/>
    <link rel="stylesheet" href="../assets/vendor/css/core.css" class="template-customizer-core-css"/>
    <link rel="stylesheet" href="../assets/vendor/css/theme-default.css" class="template-customizer-theme-css"/>
    <link rel="stylesheet" href="../assets/css/demo.css"/>
    <link rel="stylesheet" href="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css"/>
    <script src="../assets/vendor/js/helpers.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/user/user-manager.js"></script>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
        <div th:include="cms/common/sidebar::sidebar"></div>
        <div class="layout-page">
            <div th:include="cms/common/header::header"></div>
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <h4 class="fw-bold py-3 mb-4 d-flex justify-content-between align-items-center">
                        <span><span class="text-muted fw-light">Quản lý người dùng /</span> Danh sách người dùng</span>
                    </h4>
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="search-ma-yeu-cau">Mã người dùng</label>
                            <input type="text" id="search-ma-yeu-cau" class="form-control"
                                   placeholder="Nhập mã người dùng">
                        </div>
                        <div class="col-md-3">
                            <label for="from-date">Từ ngày</label>
                            <input type="date" id="from-date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label for="to-date">Đến ngày</label>
                            <input type="date" id="to-date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label for="phone">Số điện thoại</label>
                            <input type="text" id="phone" class="form-control"
                                   placeholder="Nhập số điện thoại">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-12 text-right">
                            <button id="search-button" class="btn btn-primary">Tìm kiếm</button>
                            <button id="create-button" class="btn btn-success">Tạo mới người dùng</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="table-responsive text-nowrap">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th><input type="checkbox" id="selectAll"></th>
                                    <th>Mã người dùng</th>
                                    <th>Username</th>
                                    <th>Họ và tên</th>
                                    <th>Số điện thoại</th>
                                    <th>Ngày tạo</th>
                                    <th>Địa chỉ</th>
                                </tr>
                                </thead>
                                <tbody class="table-border-bottom-0" id="bodyTableData">
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>

                <div th:include="cms/common/footer::footer"></div>
                <div class="content-backdrop fade"></div>
            </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>
</div>

<script src="../assets/vendor/libs/jquery/jquery.js"></script>
<script src="../assets/vendor/libs/popper/popper.js"></script>
<script src="../assets/vendor/js/bootstrap.js"></script>
<script src="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="../assets/vendor/js/menu.js"></script>
<script src="../assets/js/main.js"></script>

<script>
    let currentPage = 0;
    const pageSize = 20;

    async function fetchUsers(pageIndex = 0) {
        const code = document.getElementById('search-ma-yeu-cau').value;
        const fromDate = document.getElementById('from-date').value;
        const toDate = document.getElementById('to-date').value;
        const phone = document.getElementById('phone').value;

        const queryParams = new URLSearchParams({
            code: code,
            fromDate: fromDate,
            toDate: toDate,
            phone: phone,
            pageIndex: pageIndex,
            pageSize: pageSize
        });

        try {
            const response = await fetch(`http://localhost:8080/api/user?${queryParams.toString()}`);
            const result = await response.json();
            if (result.code === 200) {
                populateTable(result.data);
                setupPagination(result.totalPages); // Giả sử API trả về tổng số trang
            } else {
                console.error('Error fetching users:', result.message);
            }
        } catch (error) {
            console.error('Fetch error:', error);
        }
    }

    function populateTable(users) {
        const bodyTableData = document.getElementById('bodyTableData');
        bodyTableData.innerHTML = ''; // Clear existing data

        users.forEach(user => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="checkbox"></td>
                <td>${user.code}</td>
                <td>${user.username}</td>
                <td>${user.fullName}</td>
                <td>${user.phone}</td>
                <td>${user.createdDate ? user.createdDate : 'Chưa có'}</td>
                <td>${user.address}</td>
            `;
            bodyTableData.appendChild(row);
        });
    }

    function setupPagination(totalPages) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = ''; // Clear existing pagination

        for (let i = 0; i < totalPages; i++) {
            const button = document.createElement('button');
            button.innerText = i + 1;
            button.className = 'btn btn-secondary mx-1';
            button.onclick = () => {
                currentPage = i;
                fetchUsers(currentPage);
            };
            pagination.appendChild(button);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchUsers(); // Fetch users on page load
        document.getElementById('search-button').addEventListener('click', () => {
            currentPage = 0; // Reset to first page on new search
            fetchUsers(currentPage);
        });
    });
</script>

</body>
</html>
